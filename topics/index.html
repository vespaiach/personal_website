<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vespaiach — topics</title>
  </head>
  <body>
    <!-- TODO: replace with partials/header.html, injected at build time -->
    <header x-data="header('topics')">
      <div class="brand">$ vespaiach</div>
      <nav>
        <a href="/">/posts</a>
        <a href="/topics/" aria-current="page">/topics</a>
        <a href="/about/">/about</a>
      </nav>
      <button type="button" @click="$store.palette.show()">run (⌘K)</button>
    </header>

    <main x-data="topicList">
      <template x-for="topic in topics" :key="topic.name">
        <div class="topic-row">
          <span x-text="'#' + topic.name"></span>
          <span x-text="topic.count + ' posts'"></span>
        </div>
      </template>
    </main>

    <div x-data x-show="$store.palette.open" style="display:none">
      <input type="text" x-model="$store.palette.query" placeholder="cd /posts && ls" />
      <ul>
        <template x-for="s in $store.palette.suggestions" :key="s.label">
          <li x-text="s.label"></li>
        </template>
      </ul>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
