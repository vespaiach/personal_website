<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vespaiach — topics</title>
  </head>
  <body>
    <load src="partials/header.html" active="topics" />

    <main x-data="topicList">
      <template x-for="topic in topics" :key="topic.name">
        <div class="topic-row">
          <span x-text="'#' + topic.name"></span>
          <span x-text="topic.count + ' posts'"></span>
        </div>
      </template>
    </main>

    <div x-data x-show="$store.palette.open" style="display:none">
      <input type="text" x-model="$store.palette.query" placeholder="cd /posts && ls" />
      <ul>
        <template x-for="s in $store.palette.suggestions" :key="s.label">
          <li x-text="s.label"></li>
        </template>
      </ul>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
