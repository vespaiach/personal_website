<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32">
    <link rel="icon" href="/favicon-16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vespaiach — posts</title>
  </head>
  <body>
    <load src="partials/header.html" active="posts" />
    <main x-data="terminal" @click.document="focusPrompt($event)" @command-finished="scrollAfterCommand($event)" class="terminal-main shell-wide">
      <template x-for="(prompt, index) in $store.prompts.values" :key="index">
        <load src="partials/command-line.html" />
      </template>
      <load src="partials/command-line-idle.html" />
    </main>
    <load src="partials/command-palette.html" />
    <load src="partials/help-modal.html" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
