<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vespaiach — posts</title>
  </head>
  <body>
    <load src="partials/header.html" active="posts" />

    <main x-data="postList">
      <template x-if="loading">
        <p>loading…</p>
      </template>
      <template x-for="post in posts" :key="post.slug">
        <article @click="open(post.slug)">
          <h2 x-text="post.title"></h2>
          <p x-text="post.excerpt"></p>
        </article>
      </template>
    </main>

    <!-- dummy inline post reader — real version fetches + parses content/posts/<slug>.md -->
    <section x-data x-show="$store.reader.open" style="display:none">
      <h1 x-text="$store.reader.title"></h1>
      <p x-text="$store.reader.body"></p>
    </section>

    <load src="partials/command-palette.html" />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
