<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vespaiach — posts</title>
  </head>
  <body>
    <load src="partials/header.html" active="posts" />
    <main x-data="terminal" class="terminal-main shell-wide">
      <template x-for="(prompt, index) in $store.prompts.values" :key="index">
        <load src="partials/command-line.html" />
      </template>
      <section class="command-line-section">
        <div class="command-line command-line--idle" @click="openPalette()">
          <span class="command-line__user">trinh@vespaiach</span>
          <span class="command-line__separator">in</span>
          <span class="command-line__path" x-text="`~${$store.cwd.value}`"></span>
          <span class="command-line__symbol">$</span>
          <span class="command-line__cursor" aria-hidden="true"></span>
        </div>
        <p class="command-line__idle-hint">press ⌘K, or click the prompt, to type a command</p>
      </section>
    </main>
    <load src="partials/command-palette.html" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
