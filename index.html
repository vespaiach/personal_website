<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vespaiach — posts</title>
  </head>
  <body x-data="shell('/posts')">
    <load src="partials/header.html" active="posts" />
    <main x-data="terminal" class="shell-wide flex flex-col gap-(--space-xs) px-(--space-xl) py-(--space-lg) font-mono text-(length:--code-md-size) leading-(--code-md-leading)">
      <template x-for="(prompt, index) in [{ command: 'cd /posts & ls', cwd: '/posts' }]" :key="index">
        <load src="partials/command-line.html" />
      </template>
      <load src="src/generated/posts-listing.html" />
      <load src="partials/terminal.html" />
    </main>
    <load src="partials/command-palette.html" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
