<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vespaiach — about</title>
  </head>
  <body>
    <load src="partials/header.html" active="about" />

    <main x-data="aboutPage">
      <p x-text="bio"></p>
      <pre x-text="JSON.stringify(stack, null, 2)"></pre>
      <template x-for="project in projects" :key="project.name">
        <div class="project-row">
          <a :href="project.url" target="_blank" rel="noreferrer" x-text="project.name"></a>
          <span x-text="project.what"></span>
        </div>
      </template>
    </main>

    <div x-data x-show="$store.palette.open" style="display:none">
      <input type="text" x-model="$store.palette.query" placeholder="cd /posts && ls" />
      <ul>
        <template x-for="s in $store.palette.suggestions" :key="s.label">
          <li x-text="s.label"></li>
        </template>
      </ul>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
