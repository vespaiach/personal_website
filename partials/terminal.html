<main x-data>
  <template x-for="widget in widgets" :key="widget.id">
    <div>
      <!-- Component Type A -->
      <template x-if="widget.type === 'header'">
        <h2 x-text="widget.text"></h2>
      </template>

      <!-- Component Type B -->
      <template x-if="widget.type === 'button'">
        <button x-text="widget.label"></button>
      </template>
    </div>
  </template>
</main>
