<dialog
  x-data="commandPalette()"
  id="command-palette"
  x-ref="dialog"
  @keydown.escape="close();"
  @click="lightDismiss($event)"
  aria-label="Run a command"
  class="command-palette"
>
  <div class="command-palette__header">
    <div class="command-palette__title-group">
      <h2 class="command-palette__title">Run a command</h2>
      <p class="command-palette__subtitle" x-text="`~${cwd} · esc to close`"></p>
    </div>
    <button type="button" class="command-palette__close" aria-label="Close" @click="close()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </button>
  </div>
  <div class="command-palette__body">
    <div class="command-palette__search">
      <span class="command-palette__search-prefix" aria-hidden="true">&raquo;</span>
      <span class="command-palette__search-symbol" aria-hidden="true">$</span>
      <input
        x-ref="paletteInput"
        type="text"
        autofocus
        class="command-palette__search-input"
        autocomplete="off"
        spellcheck="false"
        placeholder="cd /posts && ls"
        x-model="query"
        @input="onInput()"
        @keydown.enter.prevent="runSelected()"
        @keydown.up.prevent="onArrowUp()"
        @keydown.down.prevent="moveSelection(1)"
        @keydown.tab.prevent="completeSelected()"
      />
    </div>
    <ul class="command-palette__suggestions" x-show="suggestions.length > 0">
      <template x-for="(s, i) in suggestions" :key="s.label + i">
        <li
          class="command-palette__suggestion"
          :class="i === selectedIndex && 'is-selected'"
          @click="runSuggestion(s)"
        >
          <span class="command-palette__suggestion-label" x-text="s.label"></span>
          <span class="command-palette__suggestion-hint" x-text="s.hint"></span>
        </li>
      </template>
    </ul>
    <div class="command-palette__footer">
      <span>enter run</span>
      <span>&uarr;&darr; select</span>
      <span>tab complete</span>
      <span>esc close</span>
      <span class="command-palette__footer-match" x-text="matchLabel"></span>
    </div>
  </div>
</dialog>
