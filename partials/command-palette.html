<dialog
  x-data="{
    lightDismiss($event) {
      const rect = $refs.dialog.getBoundingClientRect();
      const inside =
        $event.clientX >= rect.left &&
        $event.clientX <= rect.right &&
        $event.clientY >= rect.top &&
        $event.clientY <= rect.bottom;
      if (!inside) {
        $refs.dialog.close();
      }
    },
  }"
  id="command-palette"
  x-ref="dialog"
  @close="$refs.dialog.close();"
  @keydown.escape="$refs.dialog.close();"
  @click="lightDismiss($event)"
  aria-label="Run a command"
  class="m-auto w-[min(640px,calc(100vw-var(--space-2xl)))] border-0 rounded-(--radius-surface) bg-(--canvas-soft) text-(--text-body) shadow-(--elev-3) p-(--space-xl) gap-(--gap-stack) open:flex open:flex-col backdrop:bg-(--overlay)"
>
  <div class="flex items-center justify-between">
    <h2 class="m-0 font-sans font-(--weight-semibold) text-(length:--body-lg-size) leading-(--body-lg-leading) text-(--ink)">Run a command</h2>
    <button type="button" class="btn-icon size-7 text-(length:--body-md-size) leading-none" aria-label="Close" @click="$refs.dialog.close(); paletteOpen = false">
      &times;
    </button>
  </div>
  <p class="m-0 font-mono text-(length:--caption-size) leading-(--caption-leading) text-(--text-mute)" x-text="$store.palette.subtitle"></p>
  <div class="divider-line"></div>
  <div class="flex items-center gap-(--space-sm) bg-(--canvas) border border-(--hairline) rounded-(--radius-control) py-(--space-sm) px-(--space-md) transition-(--transition-control) focus-within:border-(--focus-ring) focus-within:shadow-[0_0_0_2px_var(--canvas-soft),0_0_0_3px_var(--focus-ring)]">
    <span class="text-(--text-faint) font-mono select-none" aria-hidden="true">&raquo;</span>
    <span class="text-(--prompt-symbol) font-mono" aria-hidden="true">$</span>
    <input
      x-ref="paletteInput"
      type="text"
      autofocus
      class="flex-1 min-w-0 bg-transparent border-0 outline-none text-(--ink) font-mono text-(length:--code-md-size) leading-(--code-md-leading) placeholder:text-(--text-faint)"
      autocomplete="off"
      spellcheck="false"
      placeholder="cd /posts && ls"
      x-model="$store.palette.query"
      @input="$store.palette.onInput()"
      @keydown.enter.prevent="$store.palette.runSelected()"
      @keydown.up.prevent="$store.palette.onArrowUp()"
      @keydown.down.prevent="$store.palette.moveSelection(1)"
      @keydown.tab.prevent="$store.palette.completeSelected()"
    />
  </div>
  <ul class="list-none m-0 p-0 flex flex-col gap-px max-h-[min(40vh,280px)] overflow-y-auto" x-show="$store.palette.suggestions.length > 0">
    <template x-for="(s, i) in $store.palette.suggestions" :key="s.label + i">
      <li
        class="flex items-baseline gap-(--space-lg) py-(--space-xs) px-(--space-sm) rounded-(--radius-control) cursor-pointer transition-(--transition-control) hover:bg-(--canvas-raised)"
        :class="i === $store.palette.selectedIndex && 'bg-(--canvas-raised)'"
        @click="$store.palette.runSuggestion(s)"
      >
        <span class="font-mono text-(length:--code-size) text-(--ink) whitespace-pre" x-text="s.label"></span>
        <span class="ml-auto font-mono text-(length:--caption-size) text-(--text-faint) whitespace-pre" x-text="s.hint"></span>
      </li>
    </template>
  </ul>
  <div class="divider-line"></div>
  <div class="flex gap-(--space-lg) flex-wrap font-mono text-(length:--caption-size) text-(--text-faint)">
    <span>enter run</span>
    <span>&uarr;&darr; select</span>
    <span>tab complete</span>
    <span>esc close</span>
    <span class="ml-auto text-(--text-mute)" x-text="$store.palette.matchLabel"></span>
  </div>
</dialog>
