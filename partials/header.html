<header class="site-header" x-data="header">
  <div class="site-header__inner shell-wide">
    <div class="site-header__brand"><span class="site-header__brand-name">[TN]</span></div>
    <nav class="site-header__nav" @click.outside="navOpen = false" @keydown.escape="navOpen = false">
      <button type="button" class="nav-buton site-header__menu-toggle" aria-controls="site-nav-list" :aria-expanded="navOpen" @click="navOpen = !navOpen">/{=$active} <span aria-hidden="true">▾</span></button>
      <div id="site-nav-list" class="site-header__menu site-header__nav-list" :class="{ 'is-open': navOpen }" @click="navOpen = false">
        <a href="/posts/" class="nav-buton" :aria-current="'{=$active}' === 'posts' ? 'page' : null">/posts</a>
        <a href="/topics/" class="nav-buton" :aria-current="'{=$active}' === 'topics' ? 'page' : null">/topics</a>
        <a href="/projects/" class="nav-buton" :aria-current="'{=$active}' === 'projects' ? 'page' : null">/projects</a>
        <a href="/about/" class="nav-buton" :aria-current="'{=$active}' === 'about' ? 'page' : null">/about</a>
      </div>
    </nav>
    <div class="site-header__actions" @click.outside="menuOpen = false" @keydown.escape="menuOpen = false">
      <button type="button" class="btn-icon site-header__menu-toggle" aria-label="Menu" aria-controls="site-actions-list" :aria-expanded="menuOpen" @click="menuOpen = !menuOpen">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
      </button>
      <div id="site-actions-list" class="site-header__menu site-header__actions-list" :class="{ 'is-open': menuOpen }" @click="menuOpen = false">
        <button type="button" class="btn-icon" title="Run a command (⌘K)" aria-label="Run a command" @click="toggleCommandPalette()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7 11 2-2-2-2"></path><path d="M11 13h4"></path><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect></svg><span class="site-header__action-label">Run a command</span>
        </button>
        <button type="button" class="btn-icon" title="List all commands (help)" aria-label="List all commands" @click="showHelp()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span class="site-header__action-label">List all commands</span>
        </button>
        <button type="button" class="btn-icon" title="Contact me (contact)" aria-label="Contact me" @click="showContact()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg><span class="site-header__action-label">Contact me</span>
        </button>
      </div>
    </div>
  </div>
</header>
