<header class="sticky top-0 z-30 bg-(--canvas) border-b border-(--hairline)" x-data="header()">
  <div class="flex items-center gap-(--space-2xl) max-w-(--container) mx-auto py-(--space-md) px-(--space-xl) box-border shell-wide">
    <div class="flex items-baseline gap-[0.3em] flex-none font-mono text-(length:--body-sm-size)"><span class="text-(--prompt-symbol)">$</span><span class="text-(--ink)">vespaiach</span></div>
    <nav class="flex items-center gap-(--space-xxs) flex-1 min-w-0">
      <a class="nav-link" href="/" :aria-current="'{=$active}' === 'posts' ? 'page' : null">/posts</a>
      <a class="nav-link" href="/topics/" :aria-current="'{=$active}' === 'topics' ? 'page' : null">/topics</a>
      <a class="nav-link" href="/about/" :aria-current="'{=$active}' === 'about' ? 'page' : null">/about</a>
    </nav>
    <div class="flex items-center gap-(--space-sm) flex-none">
      <button type="button" class="btn-icon size-8" title="Run a command (⌘K)" aria-label="Run a command" @click="togglePalette()">
        <svg class="block" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7 11 2-2-2-2"></path><path d="M11 13h4"></path><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect></svg>
      </button>
      <button type="button" class="btn-icon size-8" title="List all commands (help)" aria-label="List all commands">
        <svg class="block" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
      </button>
    </div>
  </div>
</header>
