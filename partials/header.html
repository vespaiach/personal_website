<!--
  Shared nav chrome, injected into every page by vite-plugin-html-inject's
  `load` tag with an `active` attribute set to posts, topics, or about.
  NOTE: that tag can't be written literally in this comment — the plugin
  scans raw text (not a real HTML parser), so a literal example here would
  be matched and recursively include this very file.
  `active` is substituted at build/dev time, then checked per-link below so
  Alpine sets aria-current="page" (and the CSS active style keyed off it)
  only on the matching link.
-->
<header class="site-header" x-data="header()">
  <div class="row">
    <div class="brand"><span class="prompt">$</span><span>vespaiach</span></div>
    <nav>
      <a class="nav-link" href="/" :aria-current="'{=$active}' === 'posts' ? 'page' : null">/posts</a>
      <a class="nav-link" href="/topics/" :aria-current="'{=$active}' === 'topics' ? 'page' : null">/topics</a>
      <a class="nav-link" href="/about/" :aria-current="'{=$active}' === 'about' ? 'page' : null">/about</a>
    </nav>
    <div class="actions">
      <button type="button" class="icon-btn" title="Run a command (⌘K)" aria-label="Run a command" @click="$store.palette.show()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7 11 2-2-2-2"></path><path d="M11 13h4"></path><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect></svg>
      </button>
      <button type="button" class="icon-btn" title="List all commands (help)" aria-label="List all commands" @click="$store.palette.show()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
      </button>
    </div>
  </div>
</header>
