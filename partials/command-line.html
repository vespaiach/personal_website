<section x-data="commandLine(prompt, index)" class="command-line-section">
  <div class="command-line">
    <span class="command-line__user">[&gt;_]</span>
    <span class="command-line__separator">in</span>
    <span class="command-line__path" x-text="cwd"></span>
    <span class="command-line__symbol">$</span>
    <span class="command-line__command" :class="{ 'command-line__command--typing': typing }" x-text="typed"></span>
  </div>
  <template x-for="(result, index) in results" :key="index">
    <div class="command-line__output">
      <template x-if="result.kind === 'html'"><div x-html="result.html"></div></template>
      <template x-if="result.kind === 'text'"><pre x-text="result.text"></pre></template>
      <template x-if="result.kind === 'error'"><p class="command-line__error" x-text="result.message"></p></template>
    </div>
  </template>
</section>
